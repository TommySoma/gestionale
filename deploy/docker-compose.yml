name: gestionale

services:
  db:
    # Tag verificato su Docker Hub il 22/11/2026: pgvector 0.8.7 su PostgreSQL 18.
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD in deploy/.env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?Imposta APP_OWNER_PASSWORD in deploy/.env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?Imposta APP_API_PASSWORD in deploy/.env}
      APP_CHATBOT_PASSWORD: ${APP_CHATBOT_PASSWORD:?Imposta APP_CHATBOT_PASSWORD in deploy/.env}
    ports:
      # Solo in locale: in produzione il database è raggiungibile solo dall'API.
      - "127.0.0.1:${DB_PORTA:-5432}:5432"
    volumes:
      # Con PostgreSQL 18 il volume si monta su /var/lib/postgresql, non su .../data.
      - dati_db:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestionale"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applica le migrazioni come app_owner ed esce: docker compose run --rm migrazioni
  migrazioni:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: gestionale-api:sviluppo
    profiles: ["api"]
    working_dir: /app/migratore
    entrypoint: ["dotnet", "Gestionale.Migrator.dll"]
    environment:
      GESTIONALE_DB_MIGRAZIONI: Host=db;Port=5432;Database=gestionale;Username=app_owner;Password=${APP_OWNER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # L'API in un container Linux: in sviluppo su Windows evita i blocchi di Smart App
  # Control sui file appena compilati. Il client desktop la raggiunge su localhost:5225.
  api:
    image: gestionale-api:sviluppo
    profiles: ["api"]
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Port=5432;Database=gestionale;Username=app_api;Password=${APP_API_PASSWORD}
      Autenticazione__ChiaveFirma: ${API_CHIAVE_FIRMA:?Imposta API_CHIAVE_FIRMA in deploy/.env}
      Autenticazione__ChiaveCifraturaMfa: ${API_CHIAVE_CIFRATURA_MFA:?Imposta API_CHIAVE_CIFRATURA_MFA in deploy/.env}
      Autenticazione__TokenInstallazione: ${API_TOKEN_INSTALLAZIONE:-}
    ports:
      # Anche su ::1: su Windows "localhost" prova prima IPv6 e, senza risposta, attende secondi.
      - "127.0.0.1:${API_PORTA:-5225}:8080"
      - "[::1]:${API_PORTA:-5225}:8080"
    volumes:
      # Gli stessi documenti dell'API avviata con dotnet run, così non si perdono.
      - ../src/Gestionale.Api/dati/documenti:/dati/documenti
    depends_on:
      db:
        condition: service_healthy

  # Solo per lo sviluppo: un finto server di posta (Mailpit, MIT) che raccoglie le email
  # senza spedirle. Nei dati aziendali: server "posta", porta 1025, sicurezza nessuna.
  # Le email si leggono su http://localhost:8025.
  posta:
    # Versione verificata su Docker Hub il 28/11/2026.
    image: axllent/mailpit:v1.33.1
    profiles: ["api"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  dati_db:
