name: gestionale

services:
  db:
    # Tag verificato su Docker Hub il 22/11/2026: pgvector 0.8.7 su PostgreSQL 18.
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Imposta POSTGRES_PASSWORD in deploy/.env}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?Imposta APP_OWNER_PASSWORD in deploy/.env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?Imposta APP_API_PASSWORD in deploy/.env}
      APP_CHATBOT_PASSWORD: ${APP_CHATBOT_PASSWORD:?Imposta APP_CHATBOT_PASSWORD in deploy/.env}
    ports:
      # Solo in locale: in produzione il database è raggiungibile solo dall'API.
      - "127.0.0.1:${DB_PORTA:-5432}:5432"
    volumes:
      # Con PostgreSQL 18 il volume si monta su /var/lib/postgresql, non su .../data.
      - dati_db:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestionale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dati_db:
